<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cartStyle.css">
    <title>Cart Page</title>
</head>
<body>
    <div class="container">
       <header>
        <div class="back-button">
            <img src="images/Arrow.png" alt="Back Button">
            <h1 class="page-title">Cart</h1>
        </div>
        </header>
        <div class="cart-item1">
            <img src="images/first-cup.png" alt="First Cup">
            <div class="item-details">
                <span class="item-name">Cappuccino</span><br>
                <span class="item-description">Dalgona Macha</span><br>
                <span class="item-price">₹299</span>
            </div>
            <div class="add-to-cart">
                <button class="decrease">-</button>
                <span class="quantity">1</span>
                <button class="increase">+</button>
            </div>
        </div>
        <div class="cart-item2">
            <img src="images/second-cup.png" alt="Second Cup">
            <div class="item-details">
                <span class="item-name">Cappuccino</span><br>
                <span class="item-description">Bursting Blueberry</span><br>
                <span class="item-price">₹249</span>
            </div>
            <div class="add-to-cart">
                <button class="decrease">-</button>
                <span class="quantity">2</span>
                <button class="increase">+</button>
            </div>
            <div class="delete-button">
                <button class="delete"><img src="images/delete.png" alt="Delete"></button>
            </div>
        </div>
        <div class="cart-item3">
            <img src="images/third-picture.png" alt="Third Cup">
            <div class="item-details">
                <span class="item-name">Cappuccino</span><br>
                <span class="item-description">Cinnamon & Cocoa</span><br>
                <span class="item-price">₹99</span>
            </div>
            <div class="add-to-cart">
                <button class="decrease">-</button>
                <span class="quantity">1</span>
                <button class="increase">+</button>
            </div>
            <div class="delete-button">
                <button class="delete"><img src="images/delete.png" alt="Delete"></button>
            </div>
        </div>

        
        <div class="total-section">
            <div class="coupon">
                <span>Apply Coupon Code</span>
                <span class="arrow">&#9654;</span>
            </div>
            <div class="total-message">
                <span>Delivery Charges<span>₹49</span></span><br>
                <span>Taxes<span>₹64.86</span></span><br>
            </div>
            <div class="grand-total">
                <span>Grand Total</span>
                <span>₹1009.87</span>
            </div>
            <div class="pay-now">
                <button id="pay-now">Checkout</button>
            </div>
        </div>


    </div>
</body>
</html>
