<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cartStyle.css">
    <title>Cart Page</title>
</head>

<body>
    <div class="container">
        <header>
            <div class="back-button">
                <img onclick="window.location.href='index.html';" src="images/Arrow.png" alt="Back Button">
                <h1 class="page-title">Cart</h1>
            </div>
        </header>

        <div class="cartItemsContainer">
            <div class="cart-item1">
                <img src="images/first-cup.png" alt="First Cup">
                <div class="item-details">
                    <div class="item-name">Cappuccino</div>
                    <div class="item-description">Dalgona Macha</div>
                    <div class="item-price">₹299</div>
                </div>
                <div class="add-to-cart">
                    <button class="decrease">-</button>
                    <span class="quantity">1</span>
                    <button class="increase">+</button>
                </div>
            </div>
            <div class="cart-item2">
                <img src="images/second-cup.png" alt="Second Cup">
                <div class="item-details">
                    <div class="item-name">Cappuccino</div>
                    <div class="item-description">Bursting Blueberry</div>
                    <div class="item-price">₹249</div>
                </div>
                <div class="add-to-cart">
                    <button class="decrease">-</button>
                    <span class="quantity">2</span>
                    <button class="increase">+</button>
                </div>
                <div class="delete-button">
                    <button class="delete"><img src="images/delete.png" alt="Delete"></button>
                </div>
            </div>
            <div class="cart-item3">
                <img src="images/third-picture.png" alt="Third Cup">
                <div class="item-details">
                    <div class="item-name">Cappuccino</div>
                    <div class="item-description">Cinnamon & Cocoa</div>
                    <div class="item-price">₹99</div>
                </div>
                <div class="add-to-cart">
                    <button class="decrease">-</button>
                    <span class="quantity">1</span>
                    <button class="increase">+</button>
                </div>
            </div>
        </div>


        <div class="total-section">
            <div class="coupon">
                <span>Apply Coupon Code</span>
                <span class="arrow">&#9654;</span>
            </div>
            <div class="total-message">
                <span>Delivery Charges<span>₹49</span></span><br>
                <span>Taxes<span>₹64.86</span></span><br>
            </div>
            <div class="grand-total">
                <span>Grand Total</span>
                <span>₹1009.87</span>
            </div>
        </div>
        <div class="pay-now">
            <button onclick="window.location.href='payment.html';" id="pay-now">Checkout</button>
        </div>



    </div>
</body>

</html>
