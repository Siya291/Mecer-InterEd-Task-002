<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cappuccino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Rosarivo:ital@0;1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  </head>

  <body>
    <div class="container">
        <div class="cups">
          <img src="cups.png" alt="Cappuccino" />
        </div>
        <div class="back-button">
          <button class="back-btn"><img src="back.png" /></button>
        </div>

      <div class="menu">
        <div class="coffeeLike">
          <div class="txtCappuccino">
            <h1>Cappuccino</h1>
          </div>
          <div class="like-btn">
            <img src="heart.png" id="heart" alt="Favorite" />
          </div>
        </div>
        
        <div class="subheadingContainer">
          <div class="caramel">
            <h3>Drizzled with Caramel</h3>
          </div>
          <div class="iconStar">
            <img src="star.png" id="star" alt="Star" />
            <span class="rating">4.5</span>
          </div>
        </div>

        <div class="description">
          <p>
            A single espresso shot poured into hot foamy milk, with the surface
            topped with mildly sweetened cocoa powder and drizzled with
            scrumptious caramel syrup.
          </p>
        </div>
      </div>

      <div class="milk">  
          <p class="milk-name">Choice of Milk</p>
        <div class="milk-options">
          <button class="active">Oat Milk</button>
          <button>Soy Milk</button>
          <button>Almond Milk</button>
        </div>
      </div>

      <div class="buy">
        <p class="price">
          <span>Price</span>
          <strong>₹249</strong>
        </p>
        <button onclick="window.location.href='middlepage.html';" class="buy-button">
          <strong>BUY NOW</strong>
        </button>
      </div>
      
    </div>
  </body>
</html>
